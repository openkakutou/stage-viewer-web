name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned to a specific image, not `ubuntu-latest` — a periodic runner
    # image bump changes fontconfig/freetype/software-GL rendering and
    # would silently invalidate every committed visual-regression baseline
    # below with no code change on our side. Mirrors web-ui-kit's own
    # `.vibe/decisions/015-visual-regression-shared-preset-shape.md`.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit SHA, not a floating tag — matches
      # this org's existing CI convention (see web-ui-kit's release.yml).
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Must run before Test: the WASM bridge test suite loads
      # public/wasm/wasm_exec.js directly, the same way the app itself
      # does at runtime — see src/wasm/bridge.test.ts.
      #
      # Pinned to an exact stage release. Bumped as a follow-up step of
      # stage's own /vibe:release, per roadmap's
      # .vibe/decisions/016-wasm-version-pinning-push-based-propagation.md
      # — see this repo's own CLAUDE.md ("WASM dependency on stage") for
      # where that pin lives. Mirrors character-viewer-web's equivalent step.
      - name: Download stage WASM release
        run: npm run wasm:download -- v0.12.0

      # Separate WASM module, separate output subdirectory
      # (public/wasm/sff/) — needed to decode a BG element's sprite for the
      # background preview. Pinned independently of the stage release
      # above; bumped as a follow-up of sff's own /vibe:release. See
      # .vibe/decisions/003-background-preview-composition-and-coordinate-mapping.md.
      - name: Download sff WASM release
        run: npm run wasm:download:sff -- v0.3.1

      - name: Test
        run: npm test

      - name: Lint
        run: npx biome check .

      - name: Build
        run: npm run build

      # Keyed on the pinned @playwright/test version (package-lock.json) so
      # a version bump busts the cache instead of silently reusing a
      # mismatched browser build. Mirrors web-ui-kit's own verify.yml step.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Own step, separate from `Test` above (backlog item 011 AC) — real
      # browser screenshot comparison against the committed baselines in
      # tests/visual/**/*.spec.ts-snapshots/, not part of the jsdom-based
      # `npm test` suite. A diff fails this step, which fails this job,
      # which blocks the `deploy` job below (`needs: build`) the same way a
      # failing Test/Lint/Build step already does.
      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload visual regression diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
